[project]
name = "elevenses-backend"
version = "0.1.0"
description = "elevenses backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142,<1",
    "uvicorn[standard]>=0.54,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
